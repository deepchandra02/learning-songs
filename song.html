<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learn Songs Easily</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Bengali:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23b4532a' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M9 18V5l12-2v13'/%3E%3Ccircle cx='6' cy='18' r='3'/%3E%3Ccircle cx='18' cy='16' r='3'/%3E%3C/svg%3E">
  <script>
    /* Apply saved theme before first paint to avoid a flash */
    (function () {
      try {
        var m = localStorage.getItem("mode") || "auto";
        if (m === "auto") m = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.mode = m;
        var p = localStorage.getItem("palette") || "default";
        if (p !== "default") document.documentElement.dataset.palette = p;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <main class="page">
    <a class="back" href="./"><i data-icon="arrowLeft"></i> All songs</a>
    <header class="song-head">
      <h1 id="title"></h1>
      <p id="subtitle"></p>
    </header>

    <div class="controls" role="toolbar" aria-label="Display options">
      <div class="seg" role="group" aria-label="Layout">
        <button type="button" data-view="stacked" aria-pressed="true" title="Stacked"><i data-icon="rows"></i><span>Stacked</span></button>
        <button type="button" data-view="columns" aria-pressed="false" title="Columns"><i data-icon="columns"></i><span>Columns</span></button>
      </div>
      <div class="seg" role="group" aria-label="Font size">
        <button type="button" id="fs-down" aria-label="Smaller text">A−</button>
        <span class="fs-label" id="fs-label">100%</span>
        <button type="button" id="fs-up" aria-label="Larger text">A+</button>
      </div>
      <div class="seg" role="group" aria-label="Light or dark mode">
        <button type="button" data-mode="auto" aria-pressed="false" title="Auto (follow system)"><i data-icon="monitor"></i><span>Auto</span></button>
        <button type="button" data-mode="light" aria-pressed="false" title="Light"><i data-icon="sun"></i><span>Light</span></button>
        <button type="button" data-mode="dark" aria-pressed="false" title="Dark"><i data-icon="moon"></i><span>Dark</span></button>
      </div>
      <div class="toggles">
        <label><input type="checkbox" id="t-translit" checked> Transliteration</label>
        <label><input type="checkbox" id="t-trans" checked> Translation</label>
      </div>
      <div class="colors">
        <button type="button" class="colors-btn" id="colors-btn" aria-expanded="false" aria-controls="colors-panel">
          <i data-icon="palette"></i> Colors
        </button>
        <div class="colors-panel" id="colors-panel" hidden>
          <div class="panel-head">
            <span>Color palette</span>
            <button type="button" id="colors-close" aria-label="Close colors"><i data-icon="x"></i></button>
          </div>
          <div class="palette-list" id="palette-list"></div>
        </div>
      </div>
    </div>

    <div id="lines" class="lines" aria-live="polite"></div>
    <p id="note" class="note"></p>
  </main>
  <script src="icons.js"></script>
  <script src="theme.js"></script>
  <script src="app.js"></script>
</body>
</html>
